info:
  name: 01 - Get All Comptes
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/api/comptes
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("GET retourne 200 OK", function () {
            expect(res.getStatus()).to.eql(200);
        });

        test("La reponse contient au moins 3 comptes", function () {
            const comptes = res.getBody();

            expect(comptes).to.be.an("array");
            expect(comptes.length).to.be.at.least(3);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
